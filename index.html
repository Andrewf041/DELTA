<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I.V.I. - Jarvis Core v2.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <div class="top-bar">
            <div class="clock-section">
                <div class="time-display" id="liveClock">00:00:00</div>
                <div class="date-display" id="liveDate">Инициализация...</div>
            </div>
            <div class="weather-section" id="liveWeather">Погода загружается...</div>
        </div>

        <div class="jarvis-container">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="core-center"><div class="core-text">I.V.I.</div></div>
        </div>

        <div class="chat-area" id="chat"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Команда..." autocomplete="off">
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
